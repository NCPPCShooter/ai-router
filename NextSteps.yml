Key lessons from Phase 1:
  - API keys must NEVER appear in code or terminal output
  - Use dir .env (not type .env) to verify file existence
  - VS Code must be fully restarted after environment variable changes
  - Prefer complete file replacements over partial edits (avoids
    IndentationError and SyntaxError from manual triple-quote edits)


