PHASE 3 — SQLITE DEDUP LAYER & CINDY'S JOB BOARD
June 15, 2026
═══════════════════════════════════════════════════════════

Session: Architecture Design
  - Decided to replace full digest email with DB + notification email
  - Cindy gets a short email: "X new postings found today"
  - DB becomes the source of truth for all job postings
  - Designed SQLite schema: job_postings table with fingerprint
    deduplication (SHA-256 of title + company + url)

Files Built:
  job_db.py
    - SQLite module, no router dependency
    - init_db(), store_jobs(), get_all_jobs(), get_jobs_by_date()
    - get_total_count(), get_db_path()
    - parse_jobs_from_grok() — tuned to Grok's actual output format
    - CLI: python job_db.py (status) / python job_db.py --clear
    - DB location: ~/ai-router/data/job_postings.db

  scheduled_search.py (rewritten)
    - Linux-compatible paths (os.path.expanduser)
    - Calls store_jobs() instead of building digest
    - build_verified_search_urls() wired in as URL fallback
    - Sends notification-only email with new/dupe counts
    - Logging via Python logging module to logs/search_log.txt

  tailor.py
    - Fetches job description from URL (with fallback to pasted text)
    - Reads master resume + cover letter from ~/cindy/resume/
    - Calls Claude to tailor both documents
    - Saves tailored .docx files to ~/cindy/output/<Company>_<Date>/

  cindy_app.py
    - Streamlit job board UI
    - Sidebar: filters by status, source, date range + stats dashboard
    - Job cards: title, company, location, salary, date found
    - Status buttons: Interested, Applied, Skip
    - Tailor Resume button: URL fetch + paste fallback + Claude tailor
    - Running at http://192.168.1.35:8502

  launch_cindy.sh
    - Starts Streamlit on port 8502, bound to 0.0.0.0
    - Activates venv automatically

